<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/adaptation.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="icon" type="image/png" href="assets/img/icon/icon.png">
    <title>Subcatica</title>
</head>
<body>
    <div class="progress-bar"></div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Поиск по виду, названию или описанию...">
        <select id="filterCategory">
          <option value="all">Все виды</option>
          <option value="1">Современные</option>
          <option value="2">Вымершие</option>
        </select>
        <button type="button" id="testOpenBtn" class="test-open-btn">Какая вы кошка?</button>
    </div>
    <div id="results" class="results-count"></div>

    <section class="scene" id="welcome">
        <header>
            <h1>Subcatica</h1>
        </header>
        <img src="assets/img/cats/header/cat1.png" class="parallax-cat" id="cat1" alt="домашняя кошка">
        <img src="assets/img/cats/header/cat2.png" class="parallax-cat" id="cat2" alt="домашняя кошка">
    </section>

    <div id="cats-container"></div>

    <footer>
        <p>Copyright 2026 Subcatica</p>
    </footer>

    <div id="testModal" class="modal modal-test" hidden>
        <div class="modal-content modal-content--test">
            <button type="button" class="close-btn" id="testModalClose" aria-label="Закрыть">&times;</button>
            <h2 class="modal-title">Какая вы кошка?</h2>
            <p id="testProgress" class="test-progress"></p>
            <div id="testModalBody" class="test-body"></div>
        </div>
    </div>

    <div id="mapModal" class="modal" hidden>
        <div class="modal-content">
            <button type="button" class="close-btn" id="mapModalClose" aria-label="Закрыть">&times;</button>
            <h2 id="modalCatName" class="modal-title">Ареал обитания</h2>
            <p id="mapModalStatus" class="modal-status"></p>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
